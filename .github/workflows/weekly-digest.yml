name: Weekly digest

# Collect the news and email it, whether or not any computer of Pete's is awake.
#
# State: GitHub gives each run a clean machine, so the SQLite database is carried
# between runs on a separate `state` branch by scripts/state.sh. The daily
# publish workflow uses the same script and the same concurrency group below,
# so the two never write that branch at the same time.

on:
  schedule:
    # 11:00 UTC Monday is 07:00 in Toronto during daylight saving, 06:00 in winter.
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the email instead of sending it"
        type: boolean
        default: false

concurrency:
  group: leaside-digest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Restore last week's database
        run: scripts/state.sh restore

      - name: Find the live page, if Pages is switched on
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          scripts/pages-enabled.sh > /tmp/pages.txt || true
          cat /tmp/pages.txt
          url=$(sed -n 's/^Pages is on: //p' /tmp/pages.txt)
          if [ -n "$url" ]; then
            echo "SITE_URL=$url" >> "$GITHUB_ENV"
          fi

      - name: Collect
        run: python -m leaside.cli ingest

      - name: Build the page and the health report
        run: |
          python -m leaside.cli build
          python -m leaside.cli doctor

      - name: Send the digest
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m leaside.cli digest --dry-run
          elif [ -z "$RESEND_API_KEY" ] || [ -z "$DIGEST_TO" ]; then
            echo "::error title=Email not configured::RESEND_API_KEY and DIGEST_TO are not set. Add them under Settings > Secrets and variables > Actions. Steps in docs/EMAIL-DIGEST.md. The collection still ran and was saved."
            python -m leaside.cli digest --dry-run
            exit 1
          else
            python -m leaside.cli digest
          fi

      - name: Save the database for next week
        if: always() && inputs.dry_run != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/state.sh save

      - name: Keep the page and reports as downloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leaside-page
          path: |
            site/index.html
            config/health-report.md
          retention-days: 30
          if-no-files-found: warn
