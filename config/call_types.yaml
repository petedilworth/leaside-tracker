# Police call types, grouped the owner's way (2 November 2026).
#
# The police map gives each call a type in capitals, such as "BREAK & ENTER IN
# PROGRESS". Each group below has one or more kinds, and each kind lists the
# exact police types it covers.
#
# ignore: types the owner never wants to see. Hidden by default on the Today
#   page, the map and the email, which say how many they left out. Nothing is
#   deleted: the map can show them, and the News page lists every call.
# other: any type in neither the groups nor the ignore list, which means a type
#   the police have not used here before. Shown by default, because a new type
#   may matter, and named in the health report so it can be placed.

groups:
  - name: Accidents
    kinds:
      Collision: [PERSONAL INJURY COLLISION, PROPERTY DAMAGE COLLISION]
      Fail to remain: [FAIL TO REMAIN PROPERTY DAMAGE COLLISION, FAIL TO REMAIN PERSONAL INJURY COLLISION]
  - name: Disorder
    kinds:
      Disorder: [DISORDERLIES, DISPUTE, NOISY PARTY]
  - name: Incidents
    kinds:
      Trespass: [TRESPASS]
      Indecent exposure: [INDECENT EXPOSURE, INDECENT EXPOSURE JUST OCCURRED]
      Damage: [DAMAGE JUST OCCURRED, DAMAGE IN PROGRESS]
  - name: Driving crime
    kinds:
      Impaired driver: [IMPAIRED DRIVER]
      Vehicle pursuit: [VEHICLE PURSUIT]
  - name: Violent crime
    kinds:
      Assault: [ASSAULT JUST OCCURRED, ASSAULT, ASSAULT IN PROGRESS, FIGHT]
      Weapon: [PERSON WITH A GUN, PERSON WITH A KNIFE, SOUND OF GUNSHOTS]
  - name: Theft
    kinds:
      Theft/robbery: [THEFT JUST OCCURRED, FRAUD, THEFT IN PROGRESS, HOLDUP ALARM, THEFT, ROBBERY]
      Theft of a vehicle: [THEFT OF VEHICLE]
  - name: Break-ins
    kinds:
      Break and enter: [BREAK & ENTER, BREAK & ENTER IN PROGRESS, BREAK & ENTER JUST OCCURRED, ATTEMPT BREAK & ENTER]

ignore:
  - SEE AMBULANCE
  - ASSIST AMBULANCE
  - UNKNOWN TROUBLE
  - HOLDING LOST ELDERLY
  - HOLDING ONE WITH TROUBLE
  - MISSING CHILD
  - MISSING VULNERABLE PERSON
  - HAZARD
  - FIRE
  - ARREST
  - FOUND PROPERTY
  - ANIMAL COMP
  - DEMONSTRATION
  - CHECK TRAFFIC SIGNALS
  - TRAFFIC OBSTRUCT
  - DAMAGE TO AUTO

other: Other
ignored: Ignore
